databases:
  - name: transport-db
    databaseName: transportpro
    user: transportpro
    plan: free

services:
  - type: web
    name: transport-erp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: transport-db
          property: connectionString
