services:
  - type: web
    name: transport-erp-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Udl85IMaHxsg@ep-super-shadow-b5d9si5i.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require

  - type: web
    name: transport-erp-frontend
    runtime: static
    buildCommand: npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://transport-erp-gjf2.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
